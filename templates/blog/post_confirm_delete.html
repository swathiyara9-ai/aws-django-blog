{% extends 'base.html' %}

{% block title %}Delete Post: {{ object.title }} &middot; AWS Django Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 border-top border-danger border-3">
            <div class="card-body p-4 p-md-5">
                <h2 class="h4 fw-bold text-danger mb-3">Delete Post</h2>
                <p class="text-secondary mb-4">
                    Are you sure you want to permanently delete <strong>"{{ object.title }}"</strong>? This action cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'post_detail' slug=object.slug %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            Yes, Delete Post
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
