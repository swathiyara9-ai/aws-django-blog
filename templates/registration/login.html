{% extends 'base.html' %}

{% block title %}Log In &middot; AWS Django Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Log In</h3>
                
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Enter your username">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" required id="id_password" class="form-control" placeholder="Enter your password">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Log In</button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0 small text-muted">
                    Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
